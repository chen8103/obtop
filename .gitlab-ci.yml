# GitLab 11.11-compatible syntax. Only protected, annotated vMAJOR.MINOR.PATCH
# tags are publishable; no branch push publishes a release.
image: golang:1.26.2@sha256:b54cbf583d390341599d7bcbc062425c081105cc5ef6d170ced98ef9d047c716

stages:
  - build
  - publish

variables:
  GIT_DEPTH: "0"
  GIT_STRATEGY: clone
  GIT_TERMINAL_PROMPT: "0"

build_release:
  stage: build
  only:
    refs:
      - tags
    variables:
      - '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
  script:
    - test "$CI_COMMIT_REF_PROTECTED" = "true"
    - test "$CI_DEBUG_TRACE" != "true"
    - git fetch origin +refs/heads/main:refs/remotes/origin/main
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main
    - python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
    - sh scripts/build.sh release --dry-run
    - make release
  artifacts:
    name: "obtop-$CI_COMMIT_TAG-$CI_COMMIT_SHA"
    paths:
      - dist/
    expire_in: 30 days

publish_github_release:
  stage: publish
  only:
    refs:
      - tags
    variables:
      - '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
  dependencies:
    - build_release
  script:
    - test "$CI_DEBUG_TRACE" != "true"
    - sh scripts/install-release-gh.sh
    - export PATH="$CI_PROJECT_DIR/build/release-tools:$PATH"
    - python3 -B scripts/publish-release.py --tag "$CI_COMMIT_TAG" --dry-run
    - python3 -B scripts/publish-release.py --tag "$CI_COMMIT_TAG"
